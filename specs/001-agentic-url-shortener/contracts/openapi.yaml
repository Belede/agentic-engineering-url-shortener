openapi: 3.0.3
info:
  title: Agentic URL Shortener API
  version: 1.2.0
  description: >
    v1.2.0 (additive): adds optional max_clicks on link creation and a
    LINK_EXHAUSTED 410 outcome on redirect, approved and implemented under
    the Brownfield scenario (docs/scenarios/brownfield.md, CL-02). No
    breaking change from v1.1.0 — existing links are unaffected (max_clicks
    defaults to unlimited).
    See specs/001-agentic-url-shortener/data-model.md for schema details.
servers:
  - url: http://localhost:8000
security:
  - ApiKeyAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    CreateLinkRequest:
      type: object
      required: [target_url]
      properties:
        target_url:
          type: string
          format: uri
          description: http/https only; private/loopback targets rejected (CL-05)
        expires_at:
          type: string
          format: date-time
          nullable: true
        ttl_seconds:
          type: integer
          minimum: 1
          nullable: true
          description: mutually exclusive with expires_at
        max_clicks:
          type: integer
          minimum: 1
          nullable: true
          description: optional redirect limit; omitted/null means unlimited (CL-02, added v1.2.0)
    LinkResponse:
      type: object
      properties:
        code: { type: string }
        short_url: { type: string, format: uri }
        target_url: { type: string, format: uri }
        expires_at: { type: string, format: date-time, nullable: true }
    BatchItemResult:
      type: object
      properties:
        status: { type: string, enum: [created, error] }
        target_url: { type: string, format: uri }
        code: { type: string, nullable: true }
        short_url: { type: string, format: uri, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true }
        message: { type: string, nullable: true }
    CreateBatchRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 25
          items: { $ref: "#/components/schemas/CreateLinkRequest" }
    BatchResponse:
      type: object
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/BatchItemResult" }
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
paths:
  /healthz:
    get:
      summary: Process liveness
      security: []
      responses:
        "200": { description: process is up }
  /readyz:
    get:
      summary: Dependency readiness (DB reachable)
      security: []
      responses:
        "200": { description: ready }
        "503": { description: dependency unavailable }
  /api/v1/links:
    post:
      summary: Create a short link (FR-001)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLinkRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkResponse" }
        "400":
          description: invalid URL / scheme / SSRF-blocked target (FR-002, CL-05)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: rate limit exceeded (FR-028)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: persistence unavailable (FR-010)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/links/batch:
    post:
      summary: Create 1-25 short links in one call, per-item results (CL-01, FR-029). Added in v1.1.0.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBatchRequest" }
      responses:
        "200":
          description: >
            Per-item results (even on partial item failure, overall status
            is 200 — each item's own status/error field carries the outcome).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchResponse" }
        "400":
          description: items count outside 1-25
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: >
            Rate limit exceeded — the whole batch is charged against the
            caller's rate limit up front; a 429 here creates zero links (CL-01).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /{code}:
    get:
      summary: Resolve a short code and redirect (FR-004)
      security: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "302": { description: redirect to target_url }
        "404":
          description: unknown code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "410":
          description: >
            Expired (error=LINK_EXPIRED semantics, FR-005) or exhausted
            (error=LINK_EXHAUSTED, CL-02, added v1.2.0) — distinguished by
            the response body's error field.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
